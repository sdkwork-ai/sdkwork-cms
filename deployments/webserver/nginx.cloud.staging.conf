# Generated by the SDKWork web server standard (SDKWORK_WEBSERVER_SPEC.md)
# from server.common.toml + server.cloud.toml; do not edit by hand.
user sdkwork;
worker_processes auto;
pid /run/sdkwork/cms/webserver.pid;
error_log /var/log/sdkwork/cms/webserver/error.log warn;
events {
    worker_connections 1024;
}
http {
    sendfile on;
    keepalive_timeout 75;
    client_max_body_size 1100m;
    server_tokens off;
    gzip on;
    include snippets/adaptive-web.maps.conf;
    upstream gateway {
        least_conn;
        keepalive 32;
        server sdkwork-api-cloud-gateway:8080;
    }
    server {
        listen 80;
        server_name cms-staging.sdkwork.com cms-staging.birdcoder.com cms-staging.dtupay.com cms-staging.sdkwork.cn cms-staging.birdcoder.cn cms-staging.dtupay.cn cms-staging.skubc.com cms-staging.skubc.cn cms-staging.zowalk.com cms-staging.zowalk.cn cms-staging.offer86.com cms-staging.offer86.cn cms-staging.86offer.com cms-staging.86offer.cn;
        include snippets/gateway-locations.nonproduction.conf;
    }
}
