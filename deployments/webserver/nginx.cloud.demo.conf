# Generated by the SDKWork web server standard (SDKWORK_WEBSERVER_SPEC.md)
# from server.common.toml + server.cloud.toml; do not edit by hand.
user sdkwork;
worker_processes auto;
pid /run/sdkwork/cms/webserver.pid;
error_log /var/log/sdkwork/cms/webserver/error.log warn;
events {
    worker_connections 1024;
}
http {
    sendfile on;
    keepalive_timeout 75;
    client_max_body_size 1100m;
    server_tokens off;
    gzip on;
    include snippets/adaptive-web.maps.conf;
    upstream gateway {
        least_conn;
        keepalive 32;
        server sdkwork-api-cloud-gateway:8080;
    }
    server {
        listen 80;
        server_name cms-demo.sdkwork.com cms-demo.birdcoder.com cms-demo.dtupay.com cms-demo.noaper.com cms-demo.sdkwork.cn cms-demo.birdcoder.cn cms-demo.dtupay.cn cms-demo.noaper.cn cms-demo.skubc.com cms-demo.skubc.cn cms-demo.zowalk.com cms-demo.zowalk.cn cms-demo.offer86.com cms-demo.offer86.cn cms-demo.86offer.com cms-demo.86offer.cn;
        include snippets/adaptive-web.named-locations.conf;
        include snippets/gateway-api-locations.nonproduction.conf;
        location / {
            include snippets/adaptive-web.dispatch.conf;
        }
    }
}
